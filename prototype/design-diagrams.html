<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>FeaturePilot 设计图</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f9f8;color:#213b37;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.canvas{width:1400px;height:900px;padding:45px 55px;background:linear-gradient(135deg,#f7fbfa,#eef5f3)}h1{margin:0 0 8px;font-size:28px}.sub{color:#6c7f7b;margin-bottom:36px}.row{display:flex;align-items:center;justify-content:center;gap:24px}.col{display:flex;flex-direction:column;align-items:center;gap:18px}.box{min-width:190px;padding:22px 24px;background:#fff;border:2px solid #c7dcd7;border-radius:14px;text-align:center;box-shadow:0 8px 18px #1e4b4012}.box strong{display:block;font-size:17px;margin-bottom:6px}.box small{color:#71837f}.system{border:3px solid #16a37d;background:#f2fffb}.external{border-color:#7a9ed9}.risk{border-color:#db7070}.arrow{font-size:28px;color:#5d7c75}.arrow small{font-size:11px;display:block;color:#758985;white-space:nowrap}.frame{border:3px dashed #7bc6b2;border-radius:20px;padding:30px;background:#effaf7}.layers{display:flex;flex-direction:column;gap:13px;width:860px}.layer{display:grid;grid-template-columns:180px 1fr;gap:14px;align-items:stretch}.lname{background:#153b34;color:white;border-radius:10px;display:grid;place-items:center;font-weight:700}.mods{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.mod{background:white;border:1px solid #cbded9;border-radius:10px;padding:17px;text-align:center}.mod b{display:block;color:#08765a;margin-bottom:5px}.legend{margin-top:25px;display:flex;justify-content:center;gap:22px;color:#6d7f7b;font-size:12px}.entity{width:240px;background:white;border:2px solid #9dc8bd;border-radius:12px;overflow:hidden}.entity h3{margin:0;padding:13px 16px;background:#143c35;color:#fff;font-size:15px}.entity div{padding:8px 15px;border-bottom:1px solid #e5eeec;font-size:13px}.entity em{float:right;color:#78908a}.rel{font-size:14px;color:#648078;text-align:center}.steps{display:flex;align-items:center;gap:12px;justify-content:center;flex-wrap:wrap}.step{width:188px;min-height:110px;background:#fff;border:2px solid #bed9d2;border-radius:14px;padding:18px;text-align:center}.step b{display:block;color:#08785d;margin-bottom:8px}.branch{width:220px;background:#fff8e7;border-color:#e0ae48}.stop{background:#fff0f0;border-color:#dd7171}.navmap{display:grid;grid-template-columns:repeat(5,1fr);align-items:center;gap:15px}.screen{background:#fff;border:2px solid #b9d7cf;border-radius:14px;padding:24px 15px;text-align:center;min-height:130px}.screen b{display:block;color:#08775b;font-size:16px;margin-bottom:8px}.down{display:flex;justify-content:space-around;margin-top:28px}.note{margin-top:30px;background:#fff;border-left:5px solid #16a37d;padding:16px 20px;border-radius:8px;color:#576e69}
.usecase-layout{display:grid;grid-template-columns:160px 1fr 160px;gap:22px;align-items:center}.actor{text-align:center;font-weight:700}.actor-icon{font-size:72px;line-height:1}.system-boundary{border:3px solid #66bba3;border-radius:20px;padding:28px 35px;background:#f2fbf8}.system-boundary h3{margin:0 0 22px;color:#08765a}.cases{display:grid;grid-template-columns:repeat(2,1fr);gap:20px 34px}.case{height:72px;border:2px solid #86bcae;border-radius:50%;display:grid;place-items:center;background:#fff;font-weight:650;text-align:center}.case.warncase{border-color:#dfa63a;background:#fff9eb}.assocline{text-align:center;color:#78908a;margin-top:20px}.class-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;align-items:start}.classbox{background:#fff;border:2px solid #75af9f;border-radius:8px;overflow:hidden;box-shadow:0 6px 15px #17493e10}.classbox h3{margin:0;padding:13px;background:#143d35;color:#fff;text-align:center}.classbox div{padding:9px 14px;border-bottom:1px solid #dce8e5;font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}.classbox .methods{color:#08785d}.umlrel{text-align:center;color:#617e77;font-size:17px;margin-top:20px}.umlnote{border-top:2px dashed #79958d;text-align:center;color:#637b75;padding-top:9px;margin-top:18px;font-size:12px}
</style></head><body><div id="canvas" class="canvas"></div><script>
const v=new URLSearchParams(location.search).get('view')||'context'; const c=document.querySelector('#canvas');
const head=(a,b)=>`<h1>${a}</h1><div class="sub">${b}</div>`;
const pages={
context:`${head('软件与外部环境关系图','边界：绿色虚线内为 FeaturePilot，蓝色为外部依赖。')}<div class="row" style="margin-top:95px"><div class="box"><strong>数模参赛者</strong><small>上传 CSV / 确认风险 / 下载代码</small></div><div class="arrow">→<small>文件、背景、Target</small></div><div class="frame"><div class="box system"><strong>FeaturePilot</strong><small>Streamlit 单机应用</small></div></div><div class="arrow">→<small>统计摘要 + 风险名单</small></div><div class="box external"><strong>云端 LLM 服务</strong><small>仅做语义推荐<br>返回受控 JSON</small></div></div><div class="row" style="margin-top:50px"><div class="box external"><strong>本地 CSV 文件</strong><small>原始数据，不出本机</small></div><div class="arrow">→</div><div class="box system"><strong>本地 Pandas / NumPy</strong><small>画像、风险扫描、算子执行</small></div><div class="arrow">→</div><div class="box external"><strong>导出 Python 脚本</strong><small>用户保存到竞赛项目</small></div></div><div class="legend"><span>🟢 软件内部</span><span>🔵 外部服务/文件</span><span>🔒 原始数据不上传</span></div>`,
architecture:`${head('总体架构与模块结构图','采用轻量分层架构，调用自上而下，校验结果返回界面层。')}<div class="layers"><div class="layer"><div class="lname">界面层</div><div class="mods"><div class="mod"><b>app.py</b>上传与任务配置</div><div class="mod"><b>结果看板</b>推荐与图形预览</div><div class="mod"><b>人工确认</b>风险解锁与导出</div></div></div><div class="arrow" style="text-align:center">↓ 用户命令 / ↑ 结果状态</div><div class="layer"><div class="lname">业务层</div><div class="mods"><div class="mod"><b>profiler.py</b>画像、打分、风险扫描</div><div class="mod"><b>recommender.py</b>LLM 推荐 / 本地降级</div><div class="mod"><b>codegen.py</b>校验、执行、代码拼装</div></div></div><div class="arrow" style="text-align:center">↓ 数据对象 / ↑ 校验结果</div><div class="layer"><div class="lname">基础与外部层</div><div class="mods"><div class="mod"><b>Pandas / NumPy</b>本地事实计算</div><div class="mod"><b>SafeOperatorRegistry</b>白名单纯函数</div><div class="mod"><b>LLM API</b>结构化语义推理</div></div></div></div><div class="note">依赖方向：app → profiler / recommender / codegen；codegen 只调用白名单算子，不执行模型返回的代码字符串。</div>`,
data:`${head('核心数据模型图','Session 聚合一次特征工程任务；Recommendation 与 Risk 可追溯。')}<div class="row" style="margin-top:45px"><div class="entity"><h3>TaskSession</h3><div>session_id <em>PK</em></div><div>file_name</div><div>background</div><div>target / task_type</div><div>mode / created_at</div></div><div class="rel">1<br>──<br>N</div><div class="entity"><h3>ColumnProfile</h3><div>profile_id <em>PK</em></div><div>session_id <em>FK</em></div><div>column_name / dtype</div><div>missing_rate / skew</div><div>score_json</div></div><div class="rel">1<br>──<br>0..1</div><div class="entity"><h3>RiskRecord</h3><div>risk_id <em>PK</em></div><div>profile_id <em>FK</em></div><div>risk_type / level</div><div>evidence</div><div>confirmed_at <em>敏感操作</em></div></div></div><div class="row" style="margin-top:55px"><div class="entity"><h3>Recommendation</h3><div>rec_id <em>PK</em></div><div>session_id <em>FK</em></div><div>feature_name</div><div>op / params_json</div><div>reason / status</div></div><div class="rel">N<br>──<br>1</div><div class="entity"><h3>ExportRecord</h3><div>export_id <em>PK</em></div><div>session_id <em>FK</em></div><div>selected_rec_ids</div><div>script_path</div><div>exported_at</div></div></div><div class="note">MVP 默认只在内存保存原始数据；持久化内容限定为配置、统计摘要、确认记录和导出脚本，不保存原始 CSV。</div>`,
flow:`${head('核心任务流程图','正常路径、异常降级与人工确认点均纳入设计。')}<div class="steps" style="margin-top:70px"><div class="step"><b>1 上传与配置</b>CSV + 背景 + Target</div><div class="arrow">→</div><div class="step"><b>2 本地体检</b>画像 / 打分 / 风险扫描</div><div class="arrow">→</div><div class="step"><b>3 语义推荐</b>发送统计摘要<br>返回 JSON</div><div class="arrow">→</div><div class="step"><b>4 本地校验</b>算子与列名白名单</div><div class="arrow">→</div><div class="step"><b>5 结果预览</b>特征卡片 + 分布图</div></div><div class="steps" style="margin-top:55px"><div class="step stop"><b>文件错误</b>提示原因并保留配置<br>返回步骤 1</div><div class="arrow">↗</div><div class="step branch"><b>LLM 超时</b>重试或切换<br>本地规则引擎</div><div class="arrow">↗</div><div class="step branch"><b>发现风险</b>红/黄卡默认锁定<br>逐项人工确认</div><div class="arrow">→</div><div class="step"><b>6 安全导出</b>模板拼装 Pandas<br>下载 .py</div></div>`,
navigation:`${head('页面结构与导航关系图','核心路径保持线性；任一步均可返回或重新操作。')}<div class="navmap" style="margin-top:95px"><div class="screen"><b>新建任务</b>上传文件<br>填写背景与 Target</div><div class="arrow">→</div><div class="screen"><b>数据体检</b>画像进度<br>异常字段</div><div class="arrow">→</div><div class="screen"><b>推荐结果</b>卡片选择<br>变换预览</div></div><div class="navmap" style="margin-top:45px"><div class="screen"><b>错误/空状态</b>返回修改或重试</div><div class="arrow">↖</div><div class="screen"><b>风险确认</b>查看依据<br>确认/放弃</div><div class="arrow">→</div><div class="screen"><b>代码导出</b>预览、复制<br>下载脚本</div></div><div class="note">返回策略：保留本次任务数据；“重新推荐”只重跑推荐模块；“新建任务”清空会话前二次确认。</div>`,
usecase:`${head('FeaturePilot 用例图','主要参与者为数模参赛者；模型服务作为外部协作系统。')}<div class="usecase-layout" style="margin-top:45px"><div class="actor"><div class="actor-icon">♙</div>数模参赛者</div><div class="system-boundary"><h3>FeaturePilot 系统边界</h3><div class="cases"><div class="case">上传 CSV 与配置任务</div><div class="case">查看数据体检</div><div class="case">获取语义特征推荐</div><div class="case">预览衍生效果</div><div class="case warncase">确认高风险特征</div><div class="case">导出 Pandas 代码</div><div class="case warncase">切换本地规则降级</div><div class="case">重新推荐或重试</div></div><div class="assocline">确认高风险特征 &lt;&lt;extend&gt;&gt; 预览衍生效果<br>切换本地规则降级 &lt;&lt;extend&gt;&gt; 获取语义特征推荐</div></div><div class="actor"><div class="actor-icon">♙</div>LLM 模型服务</div></div><div class="note">关联：参赛者参与全部主用例；LLM 服务仅参与“获取语义特征推荐”，不接触原始 CSV。</div>`,
classdiagram:`${head('核心类图（FeaturePilot）','描述会话、画像、推荐与安全代码生成之间的静态关系。')}<div class="class-grid"><div class="classbox"><h3>TaskSession</h3><div>+ session_id: str<br>+ target: str?<br>+ task_type: str<br>+ mode: str</div><div class="methods">+ load_csv(file)<br>+ reset()</div></div><div class="classbox"><h3>DataProfiler</h3><div>+ sample_limit: int<br>+ risk_rules: dict</div><div class="methods">+ profile(df, target): Profile<br>+ detect_risks(df): Risk[]</div></div><div class="classbox"><h3>Profile</h3><div>+ columns: ColumnProfile[]<br>+ scores: dict<br>+ risks: RiskRecord[]</div><div class="methods">+ to_prompt_summary(): dict</div></div><div class="classbox"><h3>FeatureRecommender</h3><div>+ model_client<br>+ fallback_engine</div><div class="methods">+ recommend(profile, context)<br>+ fallback(profile)</div></div><div class="classbox"><h3>Recommendation</h3><div>+ feature_name: str<br>+ op: str<br>+ params: list<br>+ reason: str<br>+ status: str</div><div class="methods">+ requires_confirm(): bool</div></div><div class="classbox"><h3>CodeGenerator</h3><div>+ registry: OperatorRegistry</div><div class="methods">+ validate(rec): Result<br>+ apply(df, rec): Series<br>+ export(recs): str</div></div></div><div class="umlrel">TaskSession ◆── Profile　　Profile 1──* Recommendation　　Recommendation *──1 CodeGenerator</div><div class="umlnote">CodeGenerator 依赖 OperatorRegistry；FeatureRecommender 依赖 LLMClient，失败时调用 LocalRuleEngine。</div>`};c.innerHTML=pages[v]||pages.context;
</script></body></html>
