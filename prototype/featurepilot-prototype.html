<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FeaturePilot - 界面原型</title>
<style>
:root{--nav:#0d1f22;--ink:#203337;--muted:#718084;--bg:#f3f7f6;--card:#fff;--green:#14a37f;--green2:#e9f8f3;--red:#d14a4a;--red2:#fff0f0;--yellow:#b57b11;--yellow2:#fff8e7;--line:#dce7e4;--blue:#4377d1}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.app{display:flex;min-height:100vh}.sidebar{width:220px;background:var(--nav);color:#d8e7e4;padding:28px 18px;position:fixed;inset:0 auto 0 0}.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:750;color:#fff;margin:0 8px 35px}.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(145deg,#26c59a,#79e2c7);display:grid;place-items:center;color:#073a31;font-weight:900}.tag{font-size:10px;background:#21453e;color:#7fe3c7;border-radius:4px;padding:2px 5px;margin-left:4px}.nav{display:flex;flex-direction:column;gap:8px}.nav a{padding:11px 13px;border-radius:9px;color:#9fb4b0;text-decoration:none}.nav a.active{background:#193c36;color:#fff}.nav small{opacity:.55;margin-right:9px}.privacy{position:absolute;bottom:24px;left:18px;right:18px;padding:13px;border:1px solid #285047;border-radius:10px;color:#8fb7af;font-size:12px}.main{margin-left:220px;width:calc(100% - 220px)}header{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 36px}.crumb{font-weight:650}.step{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px}.dot{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:#e8efed;color:#71837f}.dot.on{background:var(--green);color:#fff}.content{padding:28px 36px 42px;max-width:1240px;margin:auto}.title{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px}.title h1{font-size:25px;margin:0 0 4px}.title p{margin:0;color:var(--muted)}.badge{padding:6px 11px;border-radius:20px;background:var(--green2);color:#08745a;font-size:12px;font-weight:650}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 5px 16px rgba(14,46,40,.04)}.card h3{margin:0 0 15px;font-size:15px}.upload{border:2px dashed #b8cfca;text-align:center;padding:38px 20px;border-radius:12px;background:#fbfdfd}.upload .ico{font-size:35px;color:var(--green)}button,.btn{border:0;border-radius:8px;padding:10px 18px;font-weight:650;cursor:pointer}.primary{background:var(--green);color:#fff}.secondary{background:#edf3f1;color:#31534c}.danger{background:var(--red);color:#fff}.outline{background:#fff;border:1px solid var(--line);color:#36534e}label{display:block;color:#526863;font-size:12px;margin:10px 0 6px}select,input,textarea{width:100%;border:1px solid #cfddda;background:#fff;border-radius:8px;padding:10px 11px;color:#29443e}textarea{min-height:86px;resize:none}.tip{font-size:12px;color:var(--muted);margin-top:11px}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.metric{padding:18px}.metric b{font-size:25px;display:block}.metric span{color:var(--muted);font-size:12px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px;border-bottom:1px solid #e8efed;text-align:left}.table th{font-size:12px;color:#71827e;background:#f8faf9}.pill{display:inline-block;border-radius:12px;padding:3px 8px;font-size:11px}.safe{background:var(--green2);color:#08745a}.warn{background:var(--yellow2);color:var(--yellow)}.risk{background:var(--red2);color:var(--red)}.bar{height:7px;border-radius:5px;background:#e6efed;overflow:hidden}.bar i{display:block;height:100%;background:var(--green);border-radius:5px}.progress{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);padding:14px 16px;border-radius:11px;margin-bottom:15px}.spinner{width:22px;height:22px;border:3px solid #d8e8e4;border-top-color:var(--green);border-radius:50%}.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.flow .box{padding:17px 8px;text-align:center;border-radius:10px;background:#e9f1ef;color:#5f7370;font-size:12px}.flow .box.done{background:var(--green2);color:#08745a}.flow .box.now{background:var(--green);color:white}.rec{border-left:5px solid var(--green);position:relative}.rec.yellow{border-left-color:#dfaa3a}.rec.red{border-left-color:var(--red)}.rec h3{margin-bottom:7px}.formula{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#f4f7f6;border-radius:7px;padding:8px 10px;margin:12px 0;color:#31534d}.reason{color:#60736f;min-height:40px}.score{position:absolute;right:18px;top:18px;font-weight:750;color:var(--green)}.check{display:flex;justify-content:space-between;align-items:center;margin-top:12px}.lock{color:#9c6d12;font-size:12px}.notice{padding:14px 16px;border-radius:10px;margin-bottom:16px}.notice.yellow{background:var(--yellow2);border:1px solid #eedca9;color:#7d5b18}.notice.red{background:var(--red2);border:1px solid #f0c2c2;color:#9f3838}.preview{height:180px;border:1px solid var(--line);border-radius:10px;background:linear-gradient(#fff,#fafcfc);display:flex;align-items:flex-end;justify-content:center;gap:8px;padding:22px}.preview i{display:block;width:18px;background:#78d9c0;border-radius:4px 4px 0 0}.code{background:#132825;color:#d2e8e2;border-radius:10px;padding:18px;font:12px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap}.errorBox{max-width:650px;margin:65px auto;text-align:center;padding:45px}.errorIcon{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;margin:auto;background:var(--red2);color:var(--red);font-size:30px}.muted{color:var(--muted)}
</style></head>
<body><div class="app"><aside class="sidebar"><div class="brand"><span class="logo">F</span>FeaturePilot <span class="tag">MVP</span></div><nav class="nav"><a data-v="upload"><small>01</small> 新建任务</a><a data-v="profile"><small>02</small> 数据体检</a><a data-v="results"><small>03</small> 特征推荐</a><a data-v="confirm"><small>04</small> 风险确认</a><a data-v="export"><small>05</small> 代码导出</a></nav><div class="privacy">🔒 原始数据仅在本机处理<br>云端只接收统计摘要</div></aside><main class="main"><header><div class="crumb">语义感知型特征工程流水线</div><div class="step"><span class="dot on">1</span>数据 <span>—</span><span class="dot">2</span>推荐 <span>—</span><span class="dot">3</span>确认 <span>—</span><span class="dot">4</span>导出</div></header><section id="page" class="content"></section></main></div>
<script>
const page=document.querySelector('#page'); const q=new URLSearchParams(location.search); const view=q.get('view')||'upload';
const title=(h,p,b='本地安全模式')=>`<div class="title"><div><h1>${h}</h1><p>${p}</p></div><span class="badge">${b}</span></div>`;
const pages={
upload:()=>`${title('新建特征工程任务','上传数据并描述赛题背景，系统只提取本地统计摘要。')}<div class="grid"><div class="card"><h3>① 上传数据</h3><div class="upload"><div class="ico">⇧</div><b>拖放 CSV 文件到这里</b><p class="muted">或选择本地文件（最大 100 MB）</p><button class="secondary">选择 CSV</button></div><div class="tip">✓ 原始数据不会上传到模型服务</div></div><div class="card"><h3>② 配置任务</h3><label>一句话赛题背景</label><textarea>根据工业锅炉运行数据预测单位时间能耗，并构造具有物理意义的特征。</textarea><label>预测目标（Target）</label><select><option>energy_consumption</option><option>无特定目标（无监督模式）</option></select><label>任务类型</label><select><option>回归</option><option>分类</option></select><div class="actions"><button class="primary">开始本地体检 →</button></div></div></div>`,
profile:()=>`${title('数据体检','boiler_train.csv · 12,680 行 · 9 列','有监督 · 回归')}<div class="grid3"><div class="card metric"><b>9</b><span>字段总数</span></div><div class="card metric"><b>2</b><span>风险字段</span></div><div class="card metric"><b>0.8s</b><span>本地分析耗时</span></div></div><div class="progress"><div class="spinner"></div><div><b>正在生成语义推荐…</b><div class="muted">仅发送字段名、统计量、风险名单与赛题背景</div></div></div><div class="flow"><div class="box done">✓ CSV 解析</div><div class="box done">✓ 字段画像</div><div class="box done">✓ 风险扫描</div><div class="box now">模型推理</div><div class="box">本地校验</div></div><div class="card" style="margin-top:16px"><h3>字段体检结果</h3><table class="table"><tr><th>字段</th><th>类型</th><th>缺失率</th><th>与 Target 相关性</th><th>状态</th></tr><tr><td>pressure</td><td>float64</td><td>0.0%</td><td><div class="bar"><i style="width:78%"></i></div></td><td><span class="pill safe">正常</span></td></tr><tr><td>volume</td><td>float64</td><td>0.2%</td><td><div class="bar"><i style="width:61%"></i></div></td><td><span class="pill safe">正常</span></td></tr><tr><td>sensor_backup</td><td>float64</td><td>0.0%</td><td><div class="bar"><i style="width:99%"></i></div></td><td><span class="pill risk">疑似镜像</span></td></tr><tr><td>exhaust_temp</td><td>float64</td><td>46.8%</td><td><div class="bar"><i style="width:32%"></i></div></td><td><span class="pill warn">高缺失</span></td></tr></table></div>`,
results:()=>`${title('推荐结果','已通过算子与列名白名单校验 · 推荐 4 个可解释特征','AI 推荐已完成')}<div class="grid3"><div class="card rec"><span class="score">92</span><span class="pill safe">安全</span><h3>pressure_volume_work</h3><div class="formula">pressure × volume</div><p class="reason">压力与容积的交互量，可近似表达锅炉有效做功能力。</p><div class="check"><span>interaction</span><input type="checkbox" checked style="width:auto"></div></div><div class="card rec"><span class="score">88</span><span class="pill safe">安全</span><h3>hour_cycle</h3><div class="formula">sin/cos(hour, 24)</div><p class="reason">用循环编码保留 23 时与 0 时相邻的周期关系。</p><div class="check"><span>sin_cos</span><input type="checkbox" checked style="width:auto"></div></div><div class="card rec yellow"><span class="score">76</span><span class="pill warn">需确认</span><h3>exhaust_temp_log</h3><div class="formula">log1p(exhaust_temp)</div><p class="reason">缓解右偏分布，但源列缺失率为 46.8%。</p><div class="check"><span>log1p</span><span class="lock">🔒 暂不可选</span></div></div></div><div class="grid" style="margin-top:16px"><div class="card"><h3>变换前：pressure</h3><div class="preview">${[25,45,72,120,145,110,70,42,26].map(x=>`<i style="height:${x}px"></i>`).join('')}</div></div><div class="card"><h3>变换后：pressure_volume_work</h3><div class="preview">${[18,32,51,85,132,148,103,60,31].map(x=>`<i style="height:${x}px;background:#4f8bd8"></i>`).join('')}</div></div></div><div class="actions"><button class="secondary">重新推荐</button><button class="primary">进入风险确认 →</button></div>`,
confirm:()=>`${title('风险确认','高风险建议默认锁定，需逐项阅读并显式确认。','人工确认点')}<div class="notice yellow"><b>发现 1 个临界特征</b>　源字段 exhaust_temp 缺失率 46.8%，转换结果可能引入更多空值。</div><div class="grid"><div class="card rec yellow"><span class="pill warn">临界缺失</span><h3>exhaust_temp_log</h3><p>处理方式：平移至非负后执行 log1p；保留 NaN，不静默填充。</p><table class="table"><tr><td>风险依据</td><td>缺失率 46.8%</td></tr><tr><td>允许操作</td><td>仅 log1p，不可作为除数</td></tr><tr><td>验证方式</td><td>导出前检查新增缺失率</td></tr></table><label style="font-size:13px"><input type="checkbox" style="width:auto;margin-right:7px">我已了解风险并确认衍生</label><button class="primary" style="opacity:.45">解锁并加入导出</button></div><div class="card rec red"><span class="pill risk">已阻断</span><h3>sensor_backup_ratio</h3><p>sensor_backup 与 energy_consumption 的相关系数 r=0.9998，疑似目标镜像。</p><div class="notice red">该字段不进入模型 Prompt，也不允许自动衍生。建议从源数据中删除或人工核查。</div><button class="outline">查看检测依据</button></div></div><div class="actions"><button class="secondary">返回推荐</button><button class="primary">继续导出安全特征 →</button></div>`,
export:()=>`${title('代码导出','已选择 3 个特征 · 代码由本地模板生成','校验通过')}<div class="grid"><div class="card"><h3>导出清单</h3><table class="table"><tr><th>新特征</th><th>算子</th><th>状态</th></tr><tr><td>pressure_volume_work</td><td>interaction</td><td><span class="pill safe">通过</span></td></tr><tr><td>hour_sin / hour_cos</td><td>sin_cos</td><td><span class="pill safe">通过</span></td></tr><tr><td>exhaust_temp_log</td><td>log1p</td><td><span class="pill warn">已人工确认</span></td></tr></table><div class="notice yellow" style="margin-top:18px">导出脚本包含：除零保护、负数保护、缺失值注释与字段存在性检查。</div><div class="actions"><button class="outline">复制代码</button><button class="primary">↓ 下载 feature_pipeline.py</button></div></div><div class="card"><h3>代码预览</h3><div class="code"># Generated by FeaturePilot\nimport numpy as np\n\n# 交互特征\ndf['pressure_volume_work'] = (\n+    df['pressure'] * df['volume']\n+)\n\n# 24 小时循环编码\ndf['hour_sin'] = np.sin(\n+    2*np.pi*df['hour']/24\n+)\ndf['hour_cos'] = np.cos(\n+    2*np.pi*df['hour']/24\n+)\n\n# 保留缺失值，平移后取对数\nx = df['exhaust_temp']\ndf['exhaust_temp_log'] = np.log1p(x-x.min())</div></div></div>`,
error:()=>`${title('任务状态','当前任务未完成，可保留输入并重试。','异常状态')}<div class="card errorBox"><div class="errorIcon">!</div><h2>模型服务暂时不可用</h2><p class="muted">连接超时，原始数据与本地体检结果均已保留。</p><div class="notice yellow" style="text-align:left;margin:25px 0"><b>可选处理</b><br>立即重试云端推荐，或切换本地规则引擎继续生成基础特征。</div><button class="secondary">使用本地规则</button> <button class="primary">重新连接</button></div>`
};
page.innerHTML=(pages[view]||pages.upload)();document.querySelectorAll('.nav a').forEach(a=>{if(a.dataset.v===view)a.classList.add('active');a.href='?view='+a.dataset.v});
</script></body></html>
